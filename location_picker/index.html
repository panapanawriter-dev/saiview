<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font:14px sans-serif}button{padding:12px 18px;cursor:pointer;border:1px solid #bbb;border-radius:8px;background:white}#status{padding:8px;min-height:32px}#map{height:320px;width:100%}@media(max-width:600px){button{width:100%;min-height:48px}#map{height:280px}}
</style>
</head>
<body>
<button id="locate">現在地を取得</button><div id="status" role="status">現在地を取得するか、地図をタップして場所を選んでください。</div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
let map,marker;
const status=document.getElementById('status');
function selectPoint(lat,lon){
  marker.setLatLng([lat,lon]);
  status.textContent=`選択した位置：${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  send('streamlit:setComponentValue',{value:{lat,lon},dataType:'json'});
}
window.addEventListener('message',event=>{
  if(event.source!==window.parent || event.data.type!=='streamlit:render')return;
  const {lat,lon}=event.data.args;
  if(!map){
    if(!window.L){status.textContent='地図を読み込めません。ネットワークを確認して再読み込みしてください。';return;}
    map=L.map('map').setView([lat,lon],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    marker=L.marker([lat,lon],{draggable:true,autoPan:true}).addTo(map);
    marker.on('dragend',()=>{const p=marker.getLatLng();selectPoint(p.lat,p.lng);});
    map.on('click',e=>selectPoint(e.latlng.lat,e.latlng.lng));
  }
  document.getElementById('locate').disabled=!!event.data.disabled;
  map.invalidateSize();
  send('streamlit:setFrameHeight',{height:420});
});
document.getElementById('locate').onclick=()=>{
  if(!map)return;
  if(!navigator.geolocation){status.textContent='このブラウザでは現在地を取得できません。地図で場所を選んでください。';return;}
  const button=document.getElementById('locate');button.disabled=true;
  status.textContent='現在地を取得中…位置情報へのアクセスを許可してください。';
  navigator.geolocation.getCurrentPosition(pos=>{
    button.disabled=false;
    const {latitude,longitude}=pos.coords;
    map.setView([latitude,longitude],17);
    selectPoint(latitude,longitude);
  },error=>{
    button.disabled=false;
    status.textContent=({1:'位置情報が許可されていません。ブラウザの設定で許可するか、地図で場所を選んでください。',2:'現在地を取得できません。地図で場所を選んでください。',3:'現在地の取得がタイムアウトしました。もう一度お試しください。'})[error.code]||'現在地を取得できません。HTTPS または localhost で開いてください。';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:420});
</script>
</body>
</html>
